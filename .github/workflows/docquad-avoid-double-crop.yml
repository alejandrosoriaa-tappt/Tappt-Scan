name: Avoid DocQuad double crop

on:
  push:
    branches:
      - claude/new-session-9mhtdk
    paths:
      - '.github/workflows/docquad-avoid-double-crop.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/new-session-9mhtdk
      - name: Patch shared processing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/procesarDocumento.js')
          s = p.read_text()
          old = """      const { esquinas, confiable, razon } = await docquad.detectarDocumento(buffer);\n      if (confiable && esquinas?.length === 4) {\n        buffer = await imagen.corregirPerspectiva(buffer, esquinas);"""
          new = """      const { esquinas, confiable, razon, diagnostico } = await docquad.detectarDocumento(buffer);\n      // Una imagen ya corregida por RecorteScreen normalmente ocupa casi todo\n      // el frame. No volver a proyectarla: una segunda homografía sólo puede\n      // degradar nitidez o recortar bordes. En WhatsApp una foto encuadrada de\n      // cerca tampoco necesita corrección adicional.\n      const necesitaPerspectiva = (diagnostico?.area ?? 0) < 0.90;\n      if (confiable && esquinas?.length === 4 && necesitaPerspectiva) {\n        buffer = await imagen.corregirPerspectiva(buffer, esquinas);"""
          assert old in s, 'no se encontró bloque DocQuad esperado'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/docquad-avoid-double-crop.yml
          git add services/procesarDocumento.js
          git commit -m "fix(docquad): evita doble perspectiva en fotos ya corregidas"
          git push origin HEAD:claude/new-session-9mhtdk
