name: Scanner detector spike

on:
  workflow_dispatch:
  push:
    branches:
      - claude/new-session-9mhtdk
    paths:
      - 'scanner/docquad/**'
      - 'scanner/opencv/**'
      - 'scripts/docquad-*.js'
      - 'scripts/opencv-spike.js'
      - 'services/docquad.js'
      - 'services/procesarDocumento.js'
      - 'routes/docquad.js'
      - 'server.js'
      - 'app/src/screens/RecorteScreen.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docquad-spike.yml'

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/new-session-9mhtdk

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check product integration
        run: |
          node --check server.js
          node --check routes/docquad.js
          node --check services/docquad.js
          node --check services/procesarDocumento.js
          node --check scanner/docquad/model.js
          node --check scanner/docquad/preprocess.js
          node --check scanner/docquad/postprocess.js
          node --check scanner/docquad/ort-runtime.node.js
          node --check scanner/docquad/detector.js
          node --check scanner/opencv/detector.js
          node --check scripts/docquad-postprocess-test.js
          node --check scripts/opencv-spike.js

      - name: Verify PRODUCT DocQuad postprocess contract
        run: node scripts/docquad-postprocess-test.js

      - name: Prepare verified DocQuad model
        run: npm run docquad:model

      - name: Verify ONNX runtime against MakeACopy golden input
        run: node scripts/docquad-golden.js

      - name: Download MakeACopy DocQuad diagnostic fixture
        run: |
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/egdels/makeacopy/f4aaf8fc3a9a96422446600a139f117240d3843b/app/src/androidTest/assets/instrumented_test_data/20251007_183138_cropped.jpg' \
            --output /tmp/docquad-e2e.jpg
          test -s /tmp/docquad-e2e.jpg

      - name: Run MakeACopy fixture as DocQuad diagnostic
        env:
          DOCQUAD_ALLOW_INVALID: '1'
        run: npm run docquad:spike -- /tmp/docquad-e2e.jpg /tmp/docquad-result.json

      - name: Run OpenCV on MakeACopy fixture as diagnostic
        env:
          OPENCV_ALLOW_INVALID: '1'
        run: timeout 30s node scripts/opencv-spike.js /tmp/docquad-e2e.jpg /tmp/opencv-makeacopy.json

      - name: Require composite service fallback on MakeACopy fixture
        run: |
          timeout 45s node - <<'NODE'
          const fs = require('fs');
          const scanner = require('./services/docquad');
          (async () => {
            await scanner.prepararMotores();
            const r = await scanner.detectarDocumento(fs.readFileSync('/tmp/docquad-e2e.jpg'));
            console.log(JSON.stringify(r, null, 2));
            if (!r.confiable) throw new Error(`servicio compuesto no encontró quad: ${r.razon}`);
            if (!Array.isArray(r.esquinas) || r.esquinas.length !== 4) throw new Error('servicio compuesto no devolvió 4 esquinas');
            if (!String(r.fuente || '').startsWith('opencv')) throw new Error(`esperaba fallback OpenCV; fuente=${r.fuente}`);
            process.exit(0);
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Download CamScanner OpenCV fixture
        run: |
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/AdityaPai2398/CamScanner-In-Python/1dfad528594d570d6183113940c6b7decadc0890/test_img.jpg' \
            --output /tmp/camscanner-test.jpg
          test -s /tmp/camscanner-test.jpg

      - name: Require OpenCV detector on CamScanner fixture
        run: timeout 30s node scripts/opencv-spike.js /tmp/camscanner-test.jpg /tmp/opencv-camscanner.json

      - name: Validate OpenCV result contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/opencv-camscanner.json', 'utf8'));
          if (!r.valid) throw new Error('OpenCV fixture no produjo quad válido');
          if (!Array.isArray(r.corners) || r.corners.length !== 4) throw new Error('OpenCV no devolvió 4 esquinas');
          if (!r.corners.every(p => Number.isFinite(p.x) && Number.isFinite(p.y))) throw new Error('OpenCV devolvió coordenadas no finitas');
          if (!(r.area > 0.10 && r.area < 0.95)) throw new Error(`Área sospechosa: ${r.area}`);
          console.log(`OpenCV fixture OK source=${r.source} area=${r.area.toFixed(3)} score=${r.score.toFixed(3)}`);
          NODE

      - name: Show results
        if: always()
        run: |
          for f in /tmp/docquad-result.json /tmp/opencv-makeacopy.json /tmp/opencv-camscanner.json; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              cat "$f"
            fi
          done

      - name: Upload detector diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-spike-result
          path: |
            /tmp/docquad-result.json
            /tmp/opencv-makeacopy.json
            /tmp/opencv-camscanner.json
            /tmp/docquad-e2e.jpg
            /tmp/camscanner-test.jpg
          if-no-files-found: ignore
