name: DocQuad spike

on:
  workflow_dispatch:
  push:
    branches:
      - claude/new-session-9mhtdk
    paths:
      - 'scanner/docquad/**'
      - 'scripts/docquad-*.js'
      - 'scripts/opencv-spike.js'
      - 'services/docquad.js'
      - 'services/procesarDocumento.js'
      - 'routes/docquad.js'
      - 'server.js'
      - 'app/src/screens/RecorteScreen.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docquad-spike.yml'

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/new-session-9mhtdk

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check product integration
        run: |
          node --check server.js
          node --check routes/docquad.js
          node --check services/docquad.js
          node --check services/procesarDocumento.js
          node --check scanner/docquad/model.js
          node --check scanner/docquad/preprocess.js
          node --check scanner/docquad/postprocess.js
          node --check scanner/docquad/ort-runtime.node.js
          node --check scanner/docquad/detector.js
          node --check scripts/docquad-postprocess-test.js
          node --check scripts/opencv-spike.js

      - name: Verify PRODUCT postprocess contract
        run: node scripts/docquad-postprocess-test.js

      - name: Prepare verified DocQuad model
        run: npm run docquad:model

      - name: Verify runtime against MakeACopy golden input
        run: node scripts/docquad-golden.js

      - name: Download MakeACopy DocQuad E2E fixture
        run: |
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/egdels/makeacopy/f4aaf8fc3a9a96422446600a139f117240d3843b/app/src/androidTest/assets/instrumented_test_data/20251007_183138_cropped.jpg' \
            --output /tmp/docquad-e2e.jpg
          test -s /tmp/docquad-e2e.jpg

      # Este asset upstream NO tiene ground-truth de esquinas. MakeACopy sólo
      # exige que el detector ejecute y produzca geometría finita; sus propios
      # guardrails "suspicious" no forman parte de ese test. Por eso aquí no
      # usamos valid=true como criterio de precisión: guardamos el resultado
      # como diagnóstico y la precisión real se medirá con scanner-fixtures/.
      - name: Run upstream E2E fixture as DocQuad diagnostic
        env:
          DOCQUAD_ALLOW_INVALID: '1'
        run: npm run docquad:spike -- /tmp/docquad-e2e.jpg /tmp/docquad-result.json

      - name: Run OpenCV fallback spike on same fixture
        run: node scripts/opencv-spike.js /tmp/docquad-e2e.jpg /tmp/opencv-result.json

      - name: Show results
        if: always()
        run: |
          if [ -f /tmp/docquad-result.json ]; then
            echo '--- DOCQUAD ---'
            cat /tmp/docquad-result.json
          fi
          if [ -f /tmp/opencv-result.json ]; then
            echo '--- OPENCV ---'
            cat /tmp/opencv-result.json
          fi

      - name: Upload spike diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-spike-result
          path: |
            /tmp/docquad-result.json
            /tmp/opencv-result.json
            /tmp/docquad-e2e.jpg
          if-no-files-found: ignore
