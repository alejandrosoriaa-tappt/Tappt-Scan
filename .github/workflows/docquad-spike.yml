name: DocQuad spike

on:
  workflow_dispatch:
  push:
    branches:
      - claude/new-session-9mhtdk
    paths:
      - 'scanner/docquad/**'
      - 'scripts/docquad-*.js'
      - 'services/docquad.js'
      - 'services/procesarDocumento.js'
      - 'routes/docquad.js'
      - 'server.js'
      - 'app/src/screens/RecorteScreen.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docquad-spike.yml'

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/new-session-9mhtdk

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check product integration
        run: |
          node --check server.js
          node --check routes/docquad.js
          node --check services/docquad.js
          node --check services/procesarDocumento.js
          node --check scanner/docquad/model.js
          node --check scanner/docquad/preprocess.js
          node --check scanner/docquad/postprocess.js
          node --check scanner/docquad/ort-runtime.node.js
          node --check scanner/docquad/detector.js

      - name: Prepare verified DocQuad model
        run: npm run docquad:model

      - name: Verify runtime against MakeACopy golden input
        run: node scripts/docquad-golden.js

      # Esta es la misma fotografía que MakeACopy usa en su test E2E
      # CompositeCornerDetectorE2eInstrumentedTest y donde exige que la fuente
      # ganadora sea DOCQUAD. A diferencia de clean_scan.jpg, sí es una fixture
      # destinada explícitamente a validar el detector de esquinas.
      - name: Download MakeACopy DocQuad E2E fixture
        run: |
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/egdels/makeacopy/f4aaf8fc3a9a96422446600a139f117240d3843b/app/src/androidTest/assets/instrumented_test_data/20251007_183138_cropped.jpg' \
            --output /tmp/docquad-e2e.jpg
          test -s /tmp/docquad-e2e.jpg

      - name: Require valid DocQuad detection on E2E fixture
        run: npm run docquad:spike -- /tmp/docquad-e2e.jpg /tmp/docquad-result.json

      - name: Show result
        if: always()
        run: |
          if [ -f /tmp/docquad-result.json ]; then
            cat /tmp/docquad-result.json
          fi

      - name: Upload spike report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docquad-spike-result
          path: /tmp/docquad-result.json
          if-no-files-found: ignore
